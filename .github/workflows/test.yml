name: Shell checks
on:
  push:
    paths-ignore:
      - version.txt
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: |
          zsh -n .zshrc
          zsh -n zshrc.managed
          bash -n install.sh
          bash -n termux_zsh.sh
          python3 -m unittest discover -s tests -v
